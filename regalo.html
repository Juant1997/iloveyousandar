<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4fbfc">
  <title>A gift for you 🎁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="gift-page">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <button class="gift-trigger text-center" id="openGift" type="button" aria-label="Open the gift">
      <span class="gift-icon-wrap"><span class="gift-icon">🎁</span></span>
      <span class="tap-text">tap tap</span>
      <span class="gift-hint" id="giftHint">Tap the little gift 5 times to discover your surprise</span>
    </button>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
